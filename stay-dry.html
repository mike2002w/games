<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Stay Dry!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
/* Layout: one fixed portrait canvas (420x760 logical) letterboxed on a night-sky ground. Single committed night look. */
:root{--bg:#07111f;--panel:#0f1f33;--fg:#f4f6fb;--gold:#ffd166;--water:#4cc9f0;--fire:#ff7a3d;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Fredoka,"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box}
#wrap{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
#post{position:absolute;display:flex;gap:.4em;box-sizing:border-box}
#post[hidden]{display:none}
#post input{flex:1;min-width:0;border:2px solid #2b466e;border-radius:.6em;background:#0f1f33;color:#f4f6fb;font:inherit;font-weight:700;padding:0 .6em;outline:none}
#post input:focus{border-color:#ffd166}
#post button{flex:0 0 auto;border:0;border-radius:.6em;background:#4cc9f0;color:#07111f;font:inherit;font-weight:700;padding:0 .9em;cursor:pointer}
#post button:active{transform:translateY(1px)}
canvas{display:block;border-radius:14px;box-shadow:0 0 0 1px #1d3252,0 20px 60px rgba(0,0,0,.6);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
</style>
<meta property="og:title" content="Stay Dry! The Fyre Drill Game">
<meta property="og:description" content="A game for Ella and Landon from Michael. Dodge the water jets, blast the flames, and see who stays dry (not Ryne).">
<meta property="og:url" content="https://mike2002w.github.io/games/stay-dry.html">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
</head>
<body>
<div id="wrap"><canvas id="c"></canvas><div id="post" hidden><input id="pname" maxlength="12" placeholder="Your name" autocomplete="off" aria-label="Your name"><button id="pbtn" type="button">POST SCORE</button></div></div>
<script>
'use strict';
const W=420,H=760,TAU=Math.PI*2;
const wrap=document.getElementById('wrap'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scl=1,dpr=1;
function resize(){const vw=wrap.clientWidth,vh=wrap.clientHeight;scl=Math.min(vw/W,vh/H);dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(W*scl*dpr);cv.height=Math.round(H*scl*dpr);cv.style.width=Math.round(W*scl)+'px';cv.style.height=Math.round(H*scl)+'px';}
addEventListener('resize',resize);resize();

// ---------- utils
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const f=1+amt;const r=clamp(Math.round((n>>16)*f),0,255),g=clamp(Math.round(((n>>8)&255)*f),0,255),b=clamp(Math.round((n&255)*f),0,255);return `rgb(${r},${g},${b})`;}
const FONT='Fredoka,"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif';
function txt(s,x,y,size,color,align='center',weight=700,base='middle'){ctx.font=`${weight} ${size}px ${FONT}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline=base;ctx.fillText(s,x,y);}
function otxt(s,x,y,size,color,stroke,lw,align='center'){ctx.font=`700 ${size}px ${FONT}`;ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.textAlign=align;ctx.textBaseline='middle';ctx.strokeText(s,x,y);ctx.fillStyle=color;ctx.fillText(s,x,y);}
function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}

// ---------- audio
const AU={ac:null,on:load('staydry_sound',true)};
function ac(){if(!AU.ac){try{AU.ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AU.ac&&AU.ac.state==='suspended')AU.ac.resume();return AU.ac;}
function tone(f,d,type='sine',v=0.2,slide=0){const a=ac();if(!a||!AU.on)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+d);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d);}
function noise(d,v=0.3,hp=800){const a=ac();if(!a||!AU.on)return;const len=Math.floor(a.sampleRate*d),b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=a.createGain();g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start();}
const SFX={
  splash(){noise(0.5,0.5,600);tone(300,0.3,'sine',0.15,-200);},
  bigSplash(){noise(1.4,0.9,250);tone(110,0.9,'sawtooth',0.2,-70);},
  shoot(){tone(600,0.12,'square',0.07,400);noise(0.15,0.12,2000);},
  sizzle(){noise(0.4,0.25,3000);tone(900,0.15,'triangle',0.1,300);},
  block(){tone(220,0.15,'square',0.1);tone(330,0.15,'square',0.1);},
  dodge(){tone(700,0.1,'sine',0.1,300);},
  dunk(){tone(400,0.3,'triangle',0.15,-250);noise(0.7,0.5,400);},
  warn(){tone(880,0.08,'sine',0.05);},
  tap(){tone(520,0.06,'square',0.07);},
  fanfare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.28,'triangle',0.15),i*130));},
  rumble(){tone(60,1.2,'sawtooth',0.12,20);},
  laugh(){[0,1,2,3,4,5].forEach(i=>setTimeout(()=>tone(520-i*35,0.11,'triangle',0.1),i*140));},
  geyser(){noise(0.35,0.25,200);tone(90,0.4,'sine',0.15,60);},
  phase(){tone(392,0.12,'triangle',0.12);setTimeout(()=>tone(523,0.18,'triangle',0.12),120);}
};

// ---------- cast (drawn from the real photo)
const CAST={
  ella:{name:'Ella',skin:'#f6d3b2',hair:'#e6c46c',hairStyle:'long',cap:{color:'#bfe3f5',brim:'#8fcbe8',text:'SUP',textColor:'#ff6fa8'},glasses:false,beard:'none',shirt:'#2ec4a6',style:'dress',pants:'#26a98f',kid:true},
  landon:{name:'Landon',skin:'#f6d3b2',hair:'#d8b56b',hairStyle:'short',cap:{color:'#1c1c1c',brim:'#1c1c1c',text:'UCF',textColor:'#f5c518'},glasses:false,beard:'none',shirt:'#f0785a',style:'tee',pants:'#2f6fd6',kid:true},
  michael:{name:'Michael',skin:'#e9bd98',hair:'#2a1f1a',hairStyle:'short',cap:{color:'#1a1a1a',brim:'#1a1a1a'},glasses:true,beard:'full',shirt:'#d9d4cc',style:'tee',pants:'#c9a97a'},
  courtney:{name:'Courtney',skin:'#f2caa6',hair:'#e8c777',hairStyle:'ponytail',cap:{color:'#1a1a1a',brim:'#1a1a1a'},glasses:true,beard:'none',shirt:'#4a4a48',style:'tee',pants:'#2b2b2b'},
  ryne:{name:'Ryne',skin:'#ecc3a0',hair:'#3a2a1f',hairStyle:'short',cap:{color:'#1a1a1a',brim:'#1a1a1a',text:'UCF',textColor:'#f5c518'},glasses:true,beard:'stubble',shirt:'#6f86b8',shirtText:'MAGIC',style:'tee',pants:'#3b5fb8'}
};
const ORDER=['ella','landon','michael','courtney','ryne'];
let perf=0;

// Draw a person: x center, y = feet. s scale. st: {wet,arms,mouth,shiver,cold,bounce}
function drawPerson(x,y,s,spec,st={}){
  const wet=st.wet||0;ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  if(st.shiver)ctx.translate(Math.sin(perf*45+x)*1.3*st.shiver,0);
  if(st.bounce)ctx.translate(0,-Math.abs(Math.sin(perf*9))*st.bounce);
  const dk=c=>wet?shade(c,-0.3*wet):c;
  const kid=!!spec.kid,tw=kid?24:30,torsoTop=kid?-56:-60,legTop=-28;
  { const hy0=torsoTop-18,hr0=15;
    if(spec.hairStyle==='long'){ctx.fillStyle=dk(spec.hair);rr(-hr0-6,hy0-8,2*hr0+12,hr0+36,12);ctx.fill();}
    if(spec.hairStyle==='ponytail'){ctx.fillStyle=dk(spec.hair);circ(hr0+6,hy0+8,7);ctx.fill();rr(hr0+3,hy0+6,7,22,4);ctx.fill();} }
  // legs
  ctx.fillStyle=spec.style==='dress'?spec.skin:dk(spec.pants);
  rr(-11,legTop-2,9,30,4);ctx.fill();rr(2,legTop-2,9,30,4);ctx.fill();
  // shoes
  ctx.fillStyle='#f6f6f6';rr(-13,-6,12,7,3);ctx.fill();rr(1,-6,12,7,3);ctx.fill();
  // torso / dress
  ctx.fillStyle=dk(spec.shirt);
  if(spec.style==='dress'){ctx.beginPath();ctx.moveTo(-tw/2,torsoTop);ctx.lineTo(tw/2,torsoTop);ctx.lineTo(tw/2+8,-14);ctx.lineTo(-tw/2-8,-14);ctx.closePath();ctx.fill();}
  else{rr(-tw/2,torsoTop,tw,torsoTop*-1+legTop+4,8);ctx.fill();if(spec.style==='tee'){ctx.fillStyle=shade(dk(spec.pants).startsWith('#')?spec.pants:spec.pants,-0.1);rr(-tw/2,legTop-6,tw,10,3);ctx.fill();}}
  if(spec.shirtText){txt(spec.shirtText,0,torsoTop+14,7,'#f4f4f4','center',700);}
  // arms
  const arms=st.arms||'down';ctx.strokeStyle=spec.skin;ctx.lineWidth=7;ctx.lineCap='round';
  const sh=torsoTop+6,sx=tw/2-2;
  function arm(side,ex,ey){ctx.beginPath();ctx.moveTo(side*sx,sh);ctx.lineTo(side*ex,ey);ctx.stroke();}
  if(arms==='down'){arm(-1,sx+5,legTop-2);arm(1,sx+5,legTop-2);}
  else if(arms==='up'){arm(-1,sx+9,sh-30);arm(1,sx+9,sh-30);}
  else if(arms==='peace'){arm(-1,sx+5,legTop-2);arm(1,sx+10,sh-26);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx+8,sh-30);ctx.lineTo(sx+5,sh-38);ctx.moveTo(sx+12,sh-30);ctx.lineTo(sx+15,sh-38);ctx.stroke();}
  else if(arms==='shield'){arm(-1,2,sh+10);arm(1,2,sh+10);}
  else if(arms==='cannon'){arm(-1,-4,sh+14);arm(1,8,sh+10);}
  else if(arms==='facepalm'){arm(-1,sx+5,legTop-2);arm(1,4,sh-20);}
  // head
  const hy=torsoTop-18,hr=15;
  ctx.fillStyle=spec.skin;circ(0,hy,hr);ctx.fill();
  // ears
  circ(-hr,hy+2,4);ctx.fill();circ(hr,hy+2,4);ctx.fill();
  // hair peeking under cap
  ctx.fillStyle=dk(spec.hair);
  if(spec.hairStyle==='short'){ctx.beginPath();ctx.arc(0,hy-2,hr+1,Math.PI*1.05,Math.PI*1.95);ctx.lineTo(hr+1,hy+2);ctx.lineTo(-hr-1,hy+2);ctx.closePath();ctx.fill();}
  else if(spec.hairStyle==='long'||spec.hairStyle==='ponytail'){ctx.beginPath();ctx.arc(0,hy-1,hr+1,Math.PI*1.02,Math.PI*1.98);ctx.lineTo(hr+1,hy+1);ctx.lineTo(-hr-1,hy+1);ctx.closePath();ctx.fill();}
  // cap
  if(spec.cap){ctx.fillStyle=spec.cap.color;ctx.beginPath();ctx.arc(0,hy-3,hr+2,Math.PI,0);ctx.closePath();ctx.fill();
    ctx.fillStyle=spec.cap.brim;ctx.beginPath();ctx.ellipse(0,hy-3,hr+6,4.5,0,0,TAU);ctx.fill();
    ctx.fillStyle=spec.cap.color;ctx.beginPath();ctx.ellipse(0,hy-4.5,hr+2,3.5,0,0,TAU);ctx.fill();
    if(spec.cap.text)txt(spec.cap.text,0,hy-10,6.5,spec.cap.textColor,'center',700);}
  // face
  if(spec.glasses){ctx.fillStyle='#161616';rr(-13,hy-3,11,8,3);ctx.fill();rr(2,hy-3,11,8,3);ctx.fill();ctx.fillRect(-2,hy,4,2);ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(-11,hy-2,4,2);ctx.fillRect(4,hy-2,4,2);}
  else{ctx.fillStyle='#222';circ(-5,hy,2);ctx.fill();circ(5,hy,2);ctx.fill();ctx.fillStyle='#fff';circ(-4.3,hy-.8,.7);ctx.fill();circ(5.7,hy-.8,.7);ctx.fill();}
  if(spec.beard==='full'){ctx.fillStyle='#2a1f1a';ctx.beginPath();ctx.arc(0,hy+3,hr-.5,0.15*Math.PI,0.85*Math.PI);ctx.closePath();ctx.fill();}
  if(spec.beard==='stubble'){ctx.fillStyle='rgba(50,35,25,.35)';ctx.beginPath();ctx.arc(0,hy+3,hr-1,0.2*Math.PI,0.8*Math.PI);ctx.closePath();ctx.fill();}
  const mouth=st.mouth||'smile';const my=hy+8;
  if(mouth==='smile'){ctx.strokeStyle=spec.beard==='full'?'#f3a1a1':'#8a3b3b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,my-2,5,0.15*Math.PI,0.85*Math.PI);ctx.stroke();}
  else if(mouth==='grin'){ctx.fillStyle='#8a3b3b';ctx.beginPath();ctx.arc(0,my-2,6,0,Math.PI);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-4,my-2,8,2.5);}
  else if(mouth==='o'){ctx.fillStyle='#6b2b2b';ctx.beginPath();ctx.ellipse(0,my,4,5.5,0,0,TAU);ctx.fill();}
  else if(mouth==='flat'){ctx.strokeStyle='#8a3b3b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-5,my);ctx.lineTo(5,my);ctx.stroke();}
  else if(mouth==='sad'){ctx.strokeStyle='#8a3b3b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,my+5,5,1.15*Math.PI,1.85*Math.PI);ctx.stroke();}
  // cold breath
  if(st.cold){const p=(perf*0.6+x*0.01)%1;ctx.fillStyle=`rgba(255,255,255,${0.35*(1-p)})`;circ(12+p*10,my-p*12,4+p*6);ctx.fill();}
  // wet: drips + sheen + puddle
  if(wet>0){ctx.fillStyle=`rgba(90,190,255,${0.22*wet})`;rr(-tw/2-2,hy-hr-6,tw+4,hr+6-torsoTop+(-legTop)+28,10);ctx.fill();
    ctx.fillStyle=`rgba(120,200,255,${0.9*wet})`;for(let i=0;i<5;i++){const ph=(perf*0.8+i*0.37)%1;const dx=-tw/2+4+i*(tw-8)/4;circ(dx,hy-hr+ph*(hr*2-torsoTop+legTop+40),2.2);ctx.fill();}
    ctx.fillStyle=`rgba(120,200,255,${0.5*wet})`;ctx.beginPath();ctx.ellipse(0,0,tw*0.8,4,0,0,TAU);ctx.fill();}
  ctx.restore();
}
function portrait(x,y,s,spec,st){ // head-and-shoulders crop in a circle
  ctx.save();circ(x,y,30*s);ctx.clip();ctx.fillStyle='#17304d';ctx.fillRect(x-30*s,y-30*s,60*s,60*s);drawPerson(x,y+78*s,s*0.95,spec,st);ctx.restore();
}

// ---------- scene pieces
const STARS=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*300,r:Math.random()*1.3+.4,p:Math.random()*TAU}));
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#060d1c');g.addColorStop(0.55,'#102446');g.addColorStop(1,'#0a1a33');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of STARS){ctx.fillStyle=`rgba(255,255,255,${0.5+0.5*Math.sin(perf*2+s.p)})`;circ(s.x,s.y,s.r);ctx.fill();}
  ctx.fillStyle='#f3f0d8';circ(62,70,22);ctx.fill();ctx.fillStyle='#060d1c';circ(72,62,19);ctx.fill();}
function house(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x-w/2,y-h,w,h);ctx.fillStyle=shade(col,-0.35);ctx.beginPath();ctx.moveTo(x-w/2-6,y-h);ctx.lineTo(x,y-h-h*0.7);ctx.lineTo(x+w/2+6,y-h);ctx.closePath();ctx.fill();ctx.fillStyle=`rgba(255,200,90,${0.7+0.3*Math.sin(perf*3+x)})`;ctx.fillRect(x-5,y-h+8,10,10);}
function torch(x,y){ctx.fillStyle='#5b3a1e';ctx.fillRect(x-2,y-30,4,30);const f=1+0.2*Math.sin(perf*14+x);ctx.fillStyle='#ff9a3c';circ(x,y-34,6*f);ctx.fill();ctx.fillStyle='#ffe08a';circ(x,y-36,3*f);ctx.fill();}
function drawBanks(label=true){ // left and right shores from y 120 to 540
  for(const side of[-1,1]){const x0=side<0?0:W-82;ctx.fillStyle='#15331f';ctx.beginPath();ctx.moveTo(x0,120);ctx.lineTo(x0+82,120);ctx.lineTo(x0+82,540);ctx.lineTo(x0,540);ctx.closePath();ctx.fill();
    ctx.fillStyle='#3a2a1a';ctx.fillRect(side<0?70:W-82,120,12,420);
    const bx=side<0?40:W-40;house(bx,200,46,34,'#6b4a2b');house(bx+(side<0?-12:12),300,40,30,'#7a5636');house(bx,400,50,36,'#5f4027');torch(side<0?66:W-66,260);torch(side<0?66:W-66,470);}
  // far shore + towers at horizon
  ctx.fillStyle='#0d1f3a';ctx.fillRect(0,105,W,20);for(let i=0;i<6;i++){ctx.fillStyle='#132b4d';ctx.fillRect(90+i*45,70+(i%2)*12,16,40);}
  if(label)txt('FYRE SKÖÖL',W/2,96,13,'#f5c518','center',700);
}
function drawWater(y0,y1){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,'#143a66');g.addColorStop(1,'#0b2648');ctx.fillStyle=g;ctx.fillRect(0,y0,W,y1-y0);
  ctx.strokeStyle='rgba(140,200,255,.18)';ctx.lineWidth=1.5;for(let i=0;i<14;i++){const y=y0+20+i*((y1-y0-40)/14);const ox=Math.sin(perf*1.3+i)*14;ctx.beginPath();ctx.moveTo(40+ox,y);ctx.bezierCurveTo(120+ox,y-3,200+ox,y+3,380+ox,y);ctx.stroke();}
  // torch reflections
  for(const x of[66,W-66]){ctx.fillStyle=`rgba(255,160,60,${0.12+0.05*Math.sin(perf*6)})`;ctx.beginPath();ctx.ellipse(x,y0+70,6,40,0,0,TAU);ctx.fill();}}
function shieldDisc(x,y,r,c1,c2){ctx.fillStyle=c1;circ(x,y,r);ctx.fill();ctx.fillStyle=c2;circ(x,y,r*0.55);ctx.fill();ctx.fillStyle='#ffd166';circ(x,y,r*0.2);ctx.fill();}
function viking(x,y,s,aim){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#7b5a3a';rr(-10,-26,20,22,6);ctx.fill();ctx.fillStyle='#f0c9a4';circ(0,-32,9);ctx.fill();ctx.fillStyle='#8c8c8c';ctx.beginPath();ctx.arc(0,-34,10,Math.PI,0);ctx.closePath();ctx.fill();ctx.strokeStyle='#f3efe4';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-9,-38);ctx.lineTo(-15,-48);ctx.moveTo(9,-38);ctx.lineTo(15,-48);ctx.stroke();ctx.fillStyle='#c98a3a';ctx.beginPath();ctx.arc(0,-28,8,0,Math.PI);ctx.closePath();ctx.fill();ctx.restore();}
function cannon(x,y,ang,len=26,col='#3b3b3b'){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle=col;rr(-6,-6,len,12,5);ctx.fill();ctx.fillStyle='#4cc9f0';circ(len-6,0,4);ctx.fill();ctx.restore();ctx.fillStyle='#262626';circ(x,y,8);ctx.fill();}
function flame(x,y,sz,a=1){const f=1+0.15*Math.sin(perf*18+x);ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#ff6a1f';ctx.beginPath();ctx.moveTo(x,y-28*sz*f);ctx.bezierCurveTo(x+16*sz,y-10*sz,x+14*sz,y+4*sz,x,y+8*sz);ctx.bezierCurveTo(x-14*sz,y+4*sz,x-16*sz,y-10*sz,x,y-28*sz*f);ctx.fill();ctx.fillStyle='#ffc53d';ctx.beginPath();ctx.moveTo(x,y-16*sz*f);ctx.bezierCurveTo(x+8*sz,y-6*sz,x+7*sz,y+3*sz,x,y+6*sz);ctx.bezierCurveTo(x-7*sz,y+3*sz,x-8*sz,y-6*sz,x,y-16*sz*f);ctx.fill();ctx.restore();}
function dragonDraw(x,y,s,flap,fire){ctx.save();ctx.translate(x,y);ctx.scale(s,s);const w=Math.sin(flap)*22;

function currentPhase(t){let idx=0;for(let i=0;i<PHASES.length;i++)if(t>=PHASES[i].t)idx=i;return idx;}

function updatePlay(dt){
  P.rideT+=dt;
  const pi=currentPhase(P.rideT);
  if(pi!==P.phaseIdx){P.phaseIdx=pi;P.phase=PHASES[pi];banner(P.phase.name,P.phase.sub);SFX.phase();if(P.phase.geyser)P.nextGeyser=rnd(...P.phase.geyser);if(P.phase.dragon)P.dragon={x:-90,y:135,vx:52,flap:0,drop:0.8};if(P.phase.end){P.jets.length=0;P.geysers.length=0;}}
  const ph=P.phase;
  // rivals
  const alive=P.rivals.filter(r=>!r.leaving);
  if(alive.length<ph.rivals)spawnRival();else if(alive.length>ph.rivals){alive[alive.length-1].leaving=true;}
  for(const r of P.rivals){r.x+=r.vx*dt;r.dunked=Math.max(0,r.dunked-dt);if(!r.leaving){if(r.x<95){r.x=95;r.vx=Math.abs(r.vx);}if(r.x>W-95){r.x=W-95;r.vx=-Math.abs(r.vx);}}}
  P.rivals=P.rivals.filter(r=>!(r.leaving&&(r.x<-120||r.x>W+120)));
  // jets
  if(!ph.end){P.nextJet-=dt;if(P.nextJet<=0){fireJet();P.nextJet=rnd(...ph.jetGap);}}
  for(const j of P.jets){j.t+=dt;}
  for(const j of P.jets.filter(j=>j.t>=j.warn+j.fly))landJet(j);
  P.jets=P.jets.filter(j=>j.t<j.warn+j.fly);
  // geysers
  if(ph.geyser){P.nextGeyser-=dt;if(P.nextGeyser<=0){P.geysers.push({seat:Math.random()<0.6?P.seat:Math.floor(Math.random()*3),t:0,erupted:false});P.nextGeyser=rnd(...ph.geyser);}}
  for(const g of P.geysers){g.t+=dt;if(g.t>=1.15&&!g.erupted){g.erupted=true;SFX.geyser();P.shake=Math.max(P.shake,4);if(g.seat===P.seat)takeHit(15,'GEYSER!!');}}
  P.geysers=P.geysers.filter(g=>g.t<1.8);
  // flames
  if(!ph.end){P.nextFlame-=dt;if(P.nextFlame<=0){spawnFlame();P.nextFlame=rnd(...ph.flameGap);}}
  for(const f of P.flames)f.t+=dt;P.flames=P.flames.filter(f=>f.t<f.life);
  // dragon
  if(P.dragon){const d=P.dragon;d.x+=d.vx*dt;d.flap+=dt*9;d.drop-=dt;if(d.drop<=0&&d.x>60&&d.x<W-60){d.drop=1.1;const side=d.x<W/2?-1:1;const tx=side<0?rnd(22,60):rnd(W-60,W-22),ty=rnd(160,460);P.parts.push({x:d.x+30,y:d.y,vx:(tx-d.x-30)/0.9,vy:(ty-d.y)/0.9-270,t:0,life:0.9,col:'#ff8c3a',g:600,r:7,fireball:true,tx,ty});}
    if(d.x>W+100)P.dragon=null;}
  // shots
  for(const s of P.shots){s.t+=dt;if(s.t>=s.dur&&!s.done){s.done=true;const tg=s.target;
    if(tg&&tg.kind==='flame'&&P.flames.includes(tg.ref)){P.flames.splice(P.flames.indexOf(tg.ref),1);P.flamesOut++;P.score+=10;pop('+10',s.tx,s.ty-20,'#ffd166',18);SFX.sizzle();spawnParts(s.tx,s.ty-10,10,'rgba(230,240,255,.8)',70,0.7,-120);}
    else if(tg&&tg.kind==='bucket'&&P.rivals.includes(tg.ref)){tg.ref.dunked=4.5;P.dunks++;P.score+=25;pop('DUNKED! +25',s.tx,s.ty-10,'#9be3ff',22);SFX.dunk();spawnParts(tg.ref.x,tg.ref.y-10,30,'#9be3ff',200,0.8);}
    else{spawnParts(s.tx,s.ty,8,'#9be3ff',90,0.4);}}}
  P.shots=P.shots.filter(s=>s.t<s.dur+0.05);
  // timers
  P.shieldT=Math.max(0,P.shieldT-dt);P.shieldCd=Math.max(0,P.shieldCd-dt);P.shake=Math.max(0,P.shake-dt*30);P.wetFlash=Math.max(0,P.wetFlash-dt);
  for(const p of P.parts){p.t+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.fireball&&p.t>=p.life&&!p.spent){p.spent=true;P.flames.push({x:p.tx,y:p.ty,t:0,life:rnd(4,5.5),buoy:false});spawnParts(p.tx,p.ty,8,'#ffb347',120,0.4);}}
  P.parts=P.parts.filter(p=>p.t<p.life);
  for(const p of P.pops)p.t+=dt;P.pops=P.pops.filter(p=>p.t<1.1);
  if(P.banner){P.banner.t+=dt;if(P.banner.t>2.6)P.banner=null;}
  if(ph.end&&P.rideT>=ph.t+1.9)startFinale();
}

    if(!top.length){txt(LB.loaded?'No scores yet. Be the first!':'Loading...',W/2,y0+20,12,'#9fb3d1');}
    top.forEach((r,i)=>{const y=y0+i*16;const me=LB.posted&&pname.value.trim().toLowerCase()===String(r.name).toLowerCase();txt(`${i+1}.`,46,y,12,'#9fb3d1','left',700);txt(String(r.name).slice(0,12),64,y,12,me?'#ffd166':'#fff','left',700);txt(CAST[r.who]?('as '+CAST[r.who].name):'',200,y,11,'#6f86a8','left',500);txt('★'.repeat(r.stars||0),W-100,y,11,'#ffd166','right',700);txt(String(r.score),W-46,y,12,'#fff','right',700);});
    if(LB.msg&&!LB.readOnly&&!LB.err)txt(LB.msg,W/2,548,11,LB.posted?'#b8f2c2':'#f4a261','center',700);}
  // dragon dryer gag
  ctx.fillStyle='rgba(255,255,255,.06)';rr(30,566,W-60,86,14);ctx.fill();
  ctx.fillStyle='#5a3a1e';rr(160,572,100,22,6);ctx.fill();txt('DRAGON DRYER',210,583,11,'#ffd166','center',700);txt('5 minutes · 2 fish',210,603,10,'#9fb3d1');
  dragonDraw(100,628,0.55,perf*6,true);
  for(let i=0;i<5;i++){const ph=(perf*0.7+i*0.2)%1;ctx.fillStyle=`rgba(255,255,255,${0.35*(1-ph)})`;circ(300+Math.sin(perf*3+i)*6,628-ph*34,3+ph*5);ctx.fill();}
  drawPerson(300,646,0.55,CAST.ryne,{wet:Math.max(0,1-((resultsT*0.12)%1)),arms:'down',mouth:'flat',shiver:1});
  bubble('Worth it.',300,606,10,1,80);
  // buttons
  const by=666;ctx.fillStyle='#ffd166';rr(40,by,160,50,16);ctx.fill();txt('PLAY AGAIN',120,by+25,16,'#07111f','center',700);hits.push({x:40,y:by,w:160,h:50,fn:()=>{SFX.tap();startPlay();}});
  ctx.fillStyle='rgba(255,255,255,.12)';rr(220,by,160,50,16);ctx.fill();txt('CHANGE PLAYER',300,by+25,14,'#fff','center',700);hits.push({x:220,y:by,w:160,h:50,fn:()=>{SFX.tap();G.state='select';}});
  drawSoundBtn();}

// ---------- family leaderboard (artifact db; absent when opened without it)
const post=document.getElementById('post'),pname=document.getElementById('pname'),pbtn=document.getElementById('pbtn');
const LB={db:null,ready:false,rows:[],loaded:false,err:false,readOnly:false,msg:'',posting:false,posted:false};
try{pname.value=load('staydry_name','');}catch(e){}
(async()=>{try{if(!window.claude||typeof window.claude.use!=='function')return;const db=await window.claude.use('db');if(!db)return;LB.db=db;LB.ready=true;
  const timer=setTimeout(()=>{if(!LB.loaded)LB.msg='Leaderboard is slow to load...';},10000);
  db.collection('scores').orderBy('score','desc').limit(10).onSnapshot(sn=>{LB.rows=sn.docs.map(d=>d.data());if(!sn.metadata.fromCache){LB.loaded=true;clearTimeout(timer);if(LB.msg.startsWith('Leaderboard'))LB.msg='';}},e=>{LB.err=true;clearTimeout(timer);LB.msg='Leaderboard unavailable right now';});
}catch(e){}})();
async function postScore(){if(!LB.db||LB.posting||!P||G.state!=='results')return;const name=pname.value.trim().slice(0,12);if(!name){LB.msg='Type your name first';pname.focus();return;}save('staydry_name',name);
  const id=name.toLowerCase().replace(/[^a-z0-9_\-]/g,'')||'player';LB.posting=true;LB.msg='Posting...';
  try{const ref=LB.db.collection('scores').doc(id);const snap=await ref.get();const prev=snap.exists?snap.data():null;
    if(prev&&prev.score>=P.final){LB.msg=name+"'s best is still "+prev.score;}
    else{await ref.set({name,score:P.final,stars:P.finalStars,who:G.who,dry:Math.round(P.dry),at:new Date().toISOString()});LB.msg='Posted! 🏆';LB.posted=true;SFX.fanfare();}}
  catch(e){if(e&&e.code==='invalid_argument'){LB.readOnly=true;LB.msg='Only invited editors can post scores';}else{LB.msg='Could not post. Try again.';}}
  LB.posting=false;}
pbtn.addEventListener('click',postScore);pname.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')postScore();});
function placePost(){const show=G.state==='results'&&LB.ready&&!LB.readOnly&&!LB.err;post.hidden=!show;if(!show)return;const ox=(wrap.clientWidth-W*scl)/2,oy=(wrap.clientHeight-H*scl)/2;post.style.left=(ox+44*scl)+'px';post.style.top=(oy+424*scl)+'px';post.style.width=((W-88)*scl)+'px';post.style.height=(30*scl)+'px';post.style.fontSize=(13*scl)+'px';}

// ---------- input
function onPointer(x,y){
  for(const h of hits){if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.fn();return;}}
  if(G.state==='play'){
    // flames
    let best=null,bd=34;for(const f of P.flames){const d=Math.hypot(f.x-x,f.y-y+10);if(d<bd){bd=d;best=f;}}
    if(best){shoot(best.x,best.y,{kind:'flame',ref:best});return;}
    for(const r of P.rivals){if(r.dunked<=0&&Math.hypot(r.x+30-x,r.y-63-y)<30){shoot(r.x+30,r.y-63,{kind:'bucket',ref:r});return;}}
    if(y>555){let si=0,sd=1e9;SEAT_X.forEach((sx,i)=>{const d=Math.abs(sx-x);if(d<sd){sd=d;si=i;}});moveSeat(si);return;}
    shoot(x,y,null);
  }
  else if(G.state==='finale'&&F.t>=4.6){finishGame();}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();onPointer((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H);});
addEventListener('keydown',e=>{if(G.state==='play'){if(e.key==='ArrowLeft'){moveSeat(P.seat-1);e.preventDefault();}else if(e.key==='ArrowRight'){moveSeat(P.seat+1);e.preventDefault();}else if(e.key===' '||e.key==='ArrowDown'){raiseShield();e.preventDefault();}}
  else if(e.key===' '||e.key==='Enter'){if(G.state==='title'){ac();G.state='select';}else if(G.state==='intro'){introIdx++;if(introIdx>=INTRO.length)startPlay();}else if(G.state==='finale'&&F.t>=4.6)finishGame();else if(G.state==='results')startPlay();}});

// ---------- loop
function frame(ms){const dt=Math.min(0.05,Math.max(0,(ms-last)/1000));last=ms;perf=ms/1000;
  if(G.state==='play')updatePlay(dt);else if(G.state==='finale')updateFinale(dt);else if(G.state==='results')resultsT+=dt;
  ctx.setTransform(scl*dpr,0,0,scl*dpr,0,0);hits=[];
  ({title:drawTitle,select:drawSelect,intro:drawIntro,play:drawPlay,finale:drawFinale,results:drawResults})[G.state]();placePost();
  requestAnimationFrame(frame);}
window.__debug={G:()=>G,P:()=>P,F:()=>F,LB,tick:frame,start:startPlay,finale:startFinale,results:finishGame,skipTo:t=>{P.rideT=t;},setDry:d=>{P.dry=d;},
  sim:(secs,bot=false,step=1/60)=>{let acc=0;for(let t=0;t<secs;t+=step){perf+=step;acc+=step;if(G.state==='play'){updatePlay(step);if(bot&&acc>=0.5){acc=0;hits=[];if(P.flames.length)onPointer(P.flames[0].x,P.flames[0].y-10);const j=P.jets.find(j=>j.seat===P.seat&&j.t<j.warn);if(j&&Math.random()<0.7)moveSeat((P.seat+1)%3);const r=P.rivals.find(r=>r.dunked<=0&&!r.leaving&&r.x>95&&r.x<W-95);if(r&&Math.random()<0.3)onPointer(r.x+30,r.y-63);}}else if(G.state==='finale')updateFinale(step);else if(G.state==='results')resultsT+=step;}return{state:G.state,rideT:P&&P.rideT,dry:P&&P.dry,score:P&&P.score,flamesOut:P&&P.flamesOut,dunks:P&&P.dunks,hits:P&&P.hitCount,blocks:P&&P.blocks,dodges:P&&P.dodges};}};
try{document.fonts&&document.fonts.load('700 20px Fredoka');}catch(e){}
requestAnimationFrame(frame);
</script>
