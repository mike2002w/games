<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Stay Dry!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
/* Layout: one fixed portrait canvas (420x760 logical) letterboxed on a night-sky ground. Single committed night look. */
:root{--bg:#07111f;--panel:#0f1f33;--fg:#f4f6fb;--gold:#ffd166;--water:#4cc9f0;--fire:#ff7a3d;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Fredoka,"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box}
#wrap{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
#post{position:absolute;display:flex;gap:.4em;box-sizing:border-box}
#post[hidden]{display:none}
#post input{flex:1;min-width:0;border:2px solid #2b466e;border-radius:.6em;background:#0f1f33;color:#f4f6fb;font:inherit;font-weight:700;padding:0 .6em;outline:none}
#post input:focus{border-color:#ffd166}
#post button{flex:0 0 auto;border:0;border-radius:.6em;background:#4cc9f0;color:#07111f;font:inherit;font-weight:700;padding:0 .9em;cursor:pointer}
#post button:active{transform:translateY(1px)}
canvas{display:block;border-radius:14px;box-shadow:0 0 0 1px #1d3252,0 20px 60px rgba(0,0,0,.6);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
</style>
<meta property="og:title" content="Stay Dry! The Fyre Drill Game">
<meta property="og:description" content="A game for Ella and Landon from Michael. Dodge the water jets, blast the flames, win the Oktoberfest dance-off, and see who stays dry (not Ryne).">
<meta property="og:url" content="https://mike2002w.github.io/games/stay-dry.html">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
</head>
<body>
<div id="wrap"><canvas id="c"></canvas><div id="post" hidden><input id="pname" maxlength="12" placeholder="Your name" autocomplete="off" aria-label="Your name"><button id="pbtn" type="button">POST SCORE</button></div></div>
<script>
'use strict';
const W=420,H=760,TAU=Math.PI*2;
const wrap=document.getElementById('wrap'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scl=1,dpr=1;
function resize(){const vw=wrap.clientWidth,vh=wrap.clientHeight;scl=Math.min(vw/W,vh/H);dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(W*scl*dpr);cv.height=Math.round(H*scl*dpr);cv.style.width=Math.round(W*scl)+'px';cv.style.height=Math.round(H*scl)+'px';}
addEventListener('resize',resize);resize();

// ---------- utils
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const f=1+amt;const r=clamp(Math.round((n>>16)*f),0,255),g=clamp(Math.round(((n>>8)&255)*f),0,255),b=clamp(Math.round((n&255)*f),0,255);return `rgb(${r},${g},${b})`;}
const FONT='Fredoka,"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif';
function txt(s,x,y,size,color,align='center',weight=700,base='middle'){ctx.font=`${weight} ${size}px ${FONT}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline=base;ctx.fillText(s,x,y);}
function otxt(s,x,y,size,color,stroke,lw,align='center'){ctx.font=`700 ${size}px ${FONT}`;ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.textAlign=align;ctx.textBaseline='middle';ctx.strokeText(s,x,y);ctx.fillStyle=color;ctx.fillText(s,x,y);}
function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}

// ---------- audio
const AU={ac:null,on:load('staydry_sound',true)};
function ac(){if(!AU.ac){try{AU.ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AU.ac&&AU.ac.state==='suspended')AU.ac.resume();return AU.ac;}
function tone(f,d,type='sine',v=0.2,slide=0){const a=ac();if(!a||!AU.on)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+d);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d);}
function noise(d,v=0.3,hp=800){const a=ac();if(!a||!AU.on)return;const len=Math.floor(a.sampleRate*d),b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=a.createGain();g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start();}
const SFX={
  splash(){noise(0.5,0.5,600);tone(300,0.3,'sine',0.15,-200);},
  bigSplash(){noise(1.4,0.9,250);tone(110,0.9,'sawtooth',0.2,-70);},
  shoot(){tone(600,0.12,'square',0.07,400);noise(0.15,0.12,2000);},
  sizzle(){noise(0.4,0.25,3000);tone(900,0.15,'triangle',0.1,300);},
  block(){tone(220,0.15,'square',0.1);tone(330,0.15,'square',0.1);},
  dodge(){tone(700,0.1,'sine',0.1,300);},
  dunk(){tone(400,0.3,'triangle',0.15,-250);noise(0.7,0.5,400);},
  warn(){tone(880,0.08,'sine',0.05);},
  tap(){tone(520,0.06,'square',0.07);},
  fanfare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.28,'triangle',0.15),i*130));},
  rumble(){tone(60,1.2,'sawtooth',0.12,20);},
  laugh(){[0,1,2,3,4,5].forEach(i=>setTimeout(()=>tone(520-i*35,0.11,'triangle',0.1),i*140));},
  geyser(){noise(0.35,0.25,200);tone(90,0.4,'sine',0.15,60);},
  phase(){tone(392,0.12,'triangle',0.12);setTimeout(()=>tone(523,0.18,'triangle',0.12),120);},
  fart(){tone(170,0.55,'sawtooth',0.18,-110);noise(0.5,0.12,150);setTimeout(()=>tone(120,0.3,'sawtooth',0.12,-60),350);},
  cookie(){[660,880,990,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.2,'sine',0.12),i*90));},
  perfekt(){tone(880,0.08,'square',0.06);tone(1320,0.12,'sine',0.08);},
  gut(){tone(660,0.1,'triangle',0.08);},
  miss(){tone(160,0.18,'sawtooth',0.06,-60);}
};

// ---------- cast (drawn from the real photo)
const CAST={
  ella:{name:'Ella',skin:'#f6d3b2',hair:'#e6c46c',hairStyle:'long',cap:{color:'#bfe3f5',brim:'#f4f4f4',text:'SUP',textColor:'#ff6fa8'},glasses:false,beard:'none',shirt:'#2ec4a6',style:'dress',legs:'dress',pants:'#26a98f',shoes:'#f6f6f6',prop:'wand',cheeks:true,kid:true},
  landon:{name:'Landon',skin:'#f6d3b2',hair:'#c9a25a',hairStyle:'short',cap:{color:'#1c1c1c',brim:'#1c1c1c',text:'UCF',textColor:'#f5c518'},glasses:false,beard:'none',shirt:'#f0785a',style:'tee',legs:'shorts',pants:'#2f6fd6',shoes:'#222222',prop:'ball',graphic:'baseball',cheeks:true,kid:true},
  michael:{name:'Michael',skin:'#e9bd98',hair:'#2a1f1a',hairStyle:'short',cap:{color:'#1a1a1a',brim:'#1a1a1a'},glasses:true,beard:'full',beardColor:'#2a1f1a',shirt:'#d9d4cc',style:'tee',legs:'shorts',pants:'#c9a97a',shoes:'#f6f6f6',graphic:'sketch'},
  courtney:{name:'Courtney',skin:'#f2caa6',hair:'#e8c777',hairStyle:'ponytail',cap:{color:'#1a1a1a',brim:'#1a1a1a'},glasses:true,beard:'none',shirt:'#3a3a40',style:'tee',legs:'shorts',pants:'#2b2b2b',shoes:'#f6f6f6',graphic:'disney'},
  ryne:{name:'Ryne',skin:'#ecc3a0',hair:'#3a2a1f',hairStyle:'short',cap:{color:'#1a1a1a',brim:'#1a1a1a',text:'UCF',textColor:'#f5c518'},glasses:true,beard:'full',beardColor:'#4a3222',shirt:'#6f86b8',style:'tee',legs:'shorts',pants:'#3b5fb8',shoes:'#222222',graphic:'magic'}
};
const ORDER=['ella','landon','michael','courtney','ryne'];
let perf=0;

// Draw a person: x center, y = feet. s scale. st: {wet,arms,mouth,shiver,cold,bounce,flip,lean,kick}
function drawPerson(x,y,s,spec,st={}){
  const wet=st.wet||0;ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  if(st.shiver)ctx.translate(Math.sin(perf*45+x)*1.3*st.shiver,0);
  if(st.bounce)ctx.translate(0,-Math.abs(Math.sin(perf*9))*st.bounce);
  if(st.flip)ctx.scale(-1,1);
  if(st.lean)ctx.rotate(st.lean);
  const dk=c=>wet?shade(c,-0.3*wet):c;
  const kid=!!spec.kid,tw=kid?24:30,torsoTop=kid?-56:-60,torsoH=kid?28:32,hr=kid?14.5:15,hy=torsoTop-20;
  const legTop=torsoTop+torsoH-2,sx=tw/2+4,sh=torsoTop+13,arms=st.arms||'down';
  const legs=spec.legs||(spec.style==='dress'?'dress':'pants');
  // ---- hair behind the body
  ctx.fillStyle=dk(spec.hair);
  if(spec.hairStyle==='long'){rr(-hr-4,hy-2,2*hr+8,hr+torsoH-6,11);ctx.fill();}
  if(spec.hairStyle==='ponytail'){ctx.beginPath();ctx.moveTo(4,hy+6);ctx.quadraticCurveTo(hr+10,hy+14,hr+7,torsoTop+22);ctx.quadraticCurveTo(hr+1,torsoTop+16,hr-2,hy+12);ctx.closePath();ctx.fill();ctx.fillStyle='#c23b3b';ctx.beginPath();ctx.ellipse(hr+1,hy+11,3,2.2,0.5,0,TAU);ctx.fill();}
  // ---- legs
  const skin=spec.skin;
  function leg(lx,top,bottom,col,w=9){ctx.fillStyle=col;rr(lx,top,w,bottom-top,4);ctx.fill();}
  if(legs==='dress'){leg(-11,legTop-4,-4,skin,8);leg(3,legTop-4,-4,skin,8);}
  else if(legs==='shorts'){leg(-12,legTop-2,legTop+13,dk(spec.pants),10);leg(2,legTop-2,legTop+13,dk(spec.pants),10);leg(-10,legTop+10,-4,skin,7);leg(3,legTop+10,-4,skin,7);}
  else{leg(-11,legTop-2,-4,dk(spec.pants),9);leg(2,legTop-2,-4,dk(spec.pants),9);}
  if(st.kick){ctx.fillStyle=legs==='dress'?skin:dk(spec.pants);ctx.save();ctx.translate(6,legTop);ctx.rotate(-1.1);rr(-4,-2,9,30,4);ctx.fill();ctx.fillStyle=spec.shoes||'#f6f6f6';rr(-5,24,12,7,3);ctx.fill();ctx.restore();}
  // shoes
  ctx.fillStyle=spec.shoes||'#f6f6f6';rr(-14,-6,13,7,3);ctx.fill();if(!st.kick){rr(1,-6,13,7,3);ctx.fill();}
  // ---- neck + torso
  ctx.fillStyle=skin;rr(-5,hy+hr-4,10,10,3);ctx.fill();
  ctx.fillStyle=dk(spec.shirt);
  if(spec.style==='dress'){ctx.beginPath();ctx.moveTo(-tw/2,torsoTop);ctx.lineTo(tw/2,torsoTop);ctx.lineTo(tw/2+9,legTop+2);ctx.lineTo(-tw/2-9,legTop+2);ctx.closePath();ctx.fill();rr(-tw/2-7,torsoTop+1,9,11,4);ctx.fill();rr(tw/2-2,torsoTop+1,9,11,4);ctx.fill();}
  else{rr(-tw/2,torsoTop,tw,torsoH,7);ctx.fill();rr(-tw/2-7,torsoTop+1,10,14,5);ctx.fill();rr(tw/2-3,torsoTop+1,10,14,5);ctx.fill();ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.arc(0,torsoTop+1,6,0,Math.PI);ctx.fill();}
  // shirt graphics
  const g=spec.graphic;
  if(g==='magic'){txt('ORLANDO',0,torsoTop+10,5,'#f4f4f4','center',700);txt('MAGIC',0,torsoTop+18,7,'#f4f4f4','center',700);}
  else if(g==='baseball'){const by=torsoTop+14;ctx.fillStyle='#fff';circ(0,by,3.8);ctx.fill();ctx.strokeStyle='#c23b3b';ctx.lineWidth=0.9;ctx.beginPath();ctx.arc(-3.2,by,3.4,-0.75,0.75);ctx.stroke();ctx.beginPath();ctx.arc(3.2,by,3.4,Math.PI-0.75,Math.PI+0.75);ctx.stroke();ctx.fillStyle='#5a3a1e';ctx.save();ctx.translate(0,by);ctx.rotate(-0.8);rr(-1.2,-9,2.4,14,1.2);ctx.fill();ctx.restore();}
  else if(g==='sketch'){ctx.strokeStyle='rgba(60,60,70,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-8,torsoTop+9);ctx.quadraticCurveTo(0,torsoTop+4,8,torsoTop+12);ctx.moveTo(-6,torsoTop+18);ctx.quadraticCurveTo(2,torsoTop+13,7,torsoTop+21);ctx.moveTo(-3,torsoTop+24);ctx.lineTo(4,torsoTop+25);ctx.stroke();}
  else if(g==='disney'){const base=torsoTop+14;ctx.fillStyle='#f4f4f4';ctx.fillRect(-9,base-4,18,4);for(let i=0;i<4;i++)ctx.fillRect(-9+i*5,base-6,2.5,2);for(const[cx,h,w]of[[-6,7,3],[0,11,3.5],[6,7,3]]){ctx.fillRect(cx-w/2,base-h,w,h);ctx.beginPath();ctx.moveTo(cx-w/2-0.5,base-h);ctx.lineTo(cx,base-h-3.5);ctx.lineTo(cx+w/2+0.5,base-h);ctx.closePath();ctx.fill();}ctx.fillStyle='#ff6fa8';ctx.beginPath();ctx.moveTo(0,base-15);ctx.lineTo(3,base-14);ctx.lineTo(0,base-13);ctx.closePath();ctx.fill();txt('DISNEY',0,torsoTop+21,6,'#f4f4f4','center',700);}
  // ---- prop: soccer ball under the left arm (or at the feet when the arms are busy)
  const ballUnderArm=spec.prop==='ball'&&(arms==='down'||arms==='peace'||arms==='facepalm');
  function ball(bx,by,r){ctx.fillStyle='#fff';circ(bx,by,r);ctx.fill();ctx.strokeStyle='#222';ctx.lineWidth=1;circ(bx,by,r);ctx.stroke();ctx.fillStyle='#222';for(const[ax,ay]of[[0,0],[-0.62,-0.45],[0.62,-0.45],[-0.38,0.62],[0.38,0.62]]){circ(bx+ax*r,by+ay*r,r*0.26);ctx.fill();}}
  if(ballUnderArm)ball(-tw/2-7,torsoTop+22,8.5);else if(spec.prop==='ball'&&!st.hideBall)ball(-15,-9,8);
  // ---- arms
  ctx.strokeStyle=skin;ctx.lineWidth=kid?5.5:6.5;ctx.lineCap='round';
  function arm(side,ex,ey){ctx.beginPath();ctx.moveTo(side*sx,sh);ctx.lineTo(side*ex,ey);ctx.stroke();ctx.fillStyle=skin;circ(side*ex,ey,kid?3.6:4.2);ctx.fill();return[side*ex,ey];}
  let rightHand=null;
  if(arms==='down'){arm(-1,sx+3,torsoTop+40);rightHand=arm(1,sx+3,torsoTop+40);}
  else if(arms==='up'){arm(-1,sx+9,torsoTop-26);rightHand=arm(1,sx+9,torsoTop-26);}
  else if(arms==='peace'){arm(-1,sx+3,torsoTop+40);rightHand=arm(1,sx+10,torsoTop-20);ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(sx+8,torsoTop-24);ctx.lineTo(sx+5,torsoTop-32);ctx.moveTo(sx+12,torsoTop-24);ctx.lineTo(sx+15,torsoTop-32);ctx.stroke();}
  else if(arms==='shield'){arm(-1,3,torsoTop+22);arm(1,3,torsoTop+22);}
  else if(arms==='cannon'){arm(-1,-6,torsoTop+28);arm(1,8,torsoTop+22);}
  else if(arms==='facepalm'){arm(-1,sx+3,torsoTop+40);arm(1,4,hy+4);}
  else if(arms==='clap'){arm(-1,2,torsoTop+16);arm(1,2,torsoTop+16);txt('👏',0,torsoTop+2,10,'#fff');}
  else if(arms==='out'){arm(-1,sx+18,torsoTop+8);arm(1,sx+18,torsoTop+8);}
  else if(arms==='wand'){arm(-1,sx+3,torsoTop+40);rightHand=arm(1,sx+8,torsoTop-22);}
  // wand: raised in the 'wand' pose, resting in the hand otherwise
  if(spec.prop==='wand'&&rightHand&&(arms==='wand'||arms==='down'||arms==='peace')){const[hx,hyy]=rightHand;const up=arms==='wand';const tx=hx+(up?6:10),ty=hyy-(up?24:20);ctx.strokeStyle='#5a3a1e';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(hx-(tx-hx)*0.25,hyy-(ty-hyy)*0.25);ctx.lineTo(tx,ty);ctx.stroke();ctx.strokeStyle='#8a6a3e';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(hx,hyy);ctx.lineTo(tx,ty);ctx.stroke();const sp=0.6+0.4*Math.sin(perf*12+x);ctx.fillStyle=`rgba(255,230,120,${sp})`;circ(tx+1,ty-2,4*sp);ctx.fill();ctx.fillStyle='#fff';circ(tx+1,ty-2,1.5);ctx.fill();if(up){for(let i=0;i<3;i++){const a=perf*6+i*2.1;ctx.fillStyle=`rgba(255,240,160,${0.5+0.5*Math.sin(a)})`;circ(tx+1+Math.cos(a)*9,ty-2+Math.sin(a)*9,1.4);ctx.fill();}}}
  // ---- head
  ctx.fillStyle=skin;circ(0,hy,hr);ctx.fill();
  circ(-hr,hy+2,4);ctx.fill();circ(hr,hy+2,4);ctx.fill();
  // hair showing under the cap, at the temples (long hair also frames the face)
  ctx.fillStyle=dk(spec.hair);
  if(spec.hairStyle==='long'){rr(-hr-3,hy-6,7,hr+16,3);ctx.fill();rr(hr-4,hy-6,7,hr+16,3);ctx.fill();}
  else{ctx.save();circ(0,hy,hr+0.5);ctx.clip();const hl=spec.hairStyle==='ponytail'?13:8;ctx.fillRect(-hr-1,hy-7,5,hl);ctx.fillRect(hr-4,hy-7,5,hl);ctx.restore();}
  // beard (drawn before the mouth)
  if(spec.beard==='full'){ctx.save();circ(0,hy,hr);ctx.clip();ctx.fillStyle=spec.beardColor||'#2a1f1a';ctx.fillRect(-hr,hy+4,2*hr,hr);ctx.restore();ctx.fillStyle=spec.beardColor||'#2a1f1a';rr(-6,hy+6,12,3,1.5);ctx.fill();}
  // cap: dome sits above the eyes, brim in front
  if(spec.cap){const cy=hy-5;ctx.fillStyle=spec.cap.color;ctx.beginPath();ctx.arc(0,cy,hr+1.5,Math.PI,0);ctx.closePath();ctx.fill();
    ctx.fillStyle=shade(spec.cap.color,0.35);circ(0,cy-hr-1,2);ctx.fill();
    ctx.fillStyle=spec.cap.brim;ctx.beginPath();ctx.ellipse(0,cy+0.5,hr+7.5,3.6,0,0,TAU);ctx.fill();
    ctx.fillStyle=spec.cap.color;ctx.beginPath();ctx.ellipse(0,cy-1.2,hr+1.5,2.6,0,0,TAU);ctx.fill();
    if(spec.cap.text)txt(spec.cap.text,0,cy-7.5,6.5,spec.cap.textColor,'center',700);}
  // face
  if(spec.cheeks){ctx.fillStyle='rgba(255,120,120,.28)';circ(-9,hy+6,3.2);ctx.fill();circ(9,hy+6,3.2);ctx.fill();}
  if(spec.glasses){ctx.fillStyle='#161616';rr(-13,hy-1,11,8,4);ctx.fill();rr(2,hy-1,11,8,4);ctx.fill();ctx.fillRect(-2,hy+1.5,4,2);ctx.fillStyle='rgba(255,255,255,.28)';rr(-11,hy+0.5,4,2.5,1);ctx.fill();rr(4,hy+0.5,4,2.5,1);ctx.fill();}
  else{ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-5.5,hy+2,3.6,4,0,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(5.5,hy+2,3.6,4,0,0,TAU);ctx.fill();ctx.fillStyle='#2a2320';circ(-5,hy+2.5,1.9);ctx.fill();circ(6,hy+2.5,1.9);ctx.fill();ctx.fillStyle='#fff';circ(-4.3,hy+1.6,.7);ctx.fill();circ(6.7,hy+1.6,.7);ctx.fill();}
  ctx.strokeStyle='rgba(120,70,50,.45)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,hy+6,2,0.2*Math.PI,0.8*Math.PI);ctx.stroke();
  const mouth=st.mouth||'smile';const my=hy+10,mc=spec.beard==='full'?'#e38a8a':'#8a3b3b';
  if(mouth==='smile'){ctx.strokeStyle=mc;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,my-2,5,0.15*Math.PI,0.85*Math.PI);ctx.stroke();}
  else if(mouth==='grin'){ctx.fillStyle='#8a3b3b';ctx.beginPath();ctx.arc(0,my-2,6,0,Math.PI);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-4.5,my-2,9,2.4);}
  else if(mouth==='o'){ctx.fillStyle='#6b2b2b';ctx.beginPath();ctx.ellipse(0,my,4,5.5,0,0,TAU);ctx.fill();}

function updatePlay(dt){
  P.rideT+=dt;
  const pi=currentPhase(P.rideT);
  if(pi!==P.phaseIdx){P.phaseIdx=pi;P.phase=PHASES[pi];banner(P.phase.name,P.phase.sub);SFX.phase();if(P.phase.geyser)P.nextGeyser=rnd(...P.phase.geyser);if(P.phase.dragon)P.dragon={x:-90,y:135,vx:52,flap:0,drop:0.8};if(P.phase.end){P.jets.length=0;P.geysers.length=0;}}
  const ph=P.phase;
  while(P.momentIdx<MOMENTS.length&&P.rideT>=MOMENTS[P.momentIdx].t){const m=MOMENTS[P.momentIdx++];if(m.fart)stinkBomb();else say(m.who,m.text);}
  P.speech=P.speech.filter(sp=>sp.until>P.rideT);if(P.stink){P.stink.t+=dt;if(P.stink.t>3.2)P.stink=null;}
  for(const r of P.rivals)r.stink=Math.max(0,(r.stink||0)-dt);
  // rivals
  const alive=P.rivals.filter(r=>!r.leaving);
  if(alive.length<ph.rivals)spawnRival();else if(alive.length>ph.rivals){alive[alive.length-1].leaving=true;}
  for(const r of P.rivals){r.x+=r.vx*dt;r.dunked=Math.max(0,r.dunked-dt);if(!r.leaving){if(r.x<95){r.x=95;r.vx=Math.abs(r.vx);}if(r.x>W-95){r.x=W-95;r.vx=-Math.abs(r.vx);}}}
  P.rivals=P.rivals.filter(r=>!(r.leaving&&(r.x<-120||r.x>W+120)));
  // jets
  if(!ph.end){P.nextJet-=dt;if(P.nextJet<=0){fireJet();P.nextJet=rnd(...ph.jetGap);}}
  for(const j of P.jets){j.t+=dt;}
  for(const j of P.jets.filter(j=>j.t>=j.warn+j.fly))landJet(j);
  P.jets=P.jets.filter(j=>j.t<j.warn+j.fly);
  // geysers
  if(ph.geyser){P.nextGeyser-=dt;if(P.nextGeyser<=0){P.geysers.push({seat:Math.random()<0.6?P.seat:Math.floor(Math.random()*3),t:0,erupted:false});P.nextGeyser=rnd(...ph.geyser);}}
  for(const g of P.geysers){g.t+=dt;if(g.t>=1.15&&!g.erupted){g.erupted=true;SFX.geyser();P.shake=Math.max(P.shake,4);if(g.seat===P.seat)takeHit(15,'GEYSER!!');}}
  P.geysers=P.geysers.filter(g=>g.t<1.8);
  // flames
  if(!ph.end){P.nextFlame-=dt;if(P.nextFlame<=0){spawnFlame();P.nextFlame=rnd(...ph.flameGap);}}
  for(const f of P.flames)f.t+=dt;P.flames=P.flames.filter(f=>f.t<f.life);
  // dragon
  if(P.dragon){const d=P.dragon;d.x+=d.vx*dt;d.flap+=dt*9;d.drop-=dt;if(d.drop<=0&&d.x>60&&d.x<W-60){d.drop=1.1;const side=d.x<W/2?-1:1;const tx=side<0?rnd(22,60):rnd(W-60,W-22),ty=rnd(160,460);P.parts.push({x:d.x+30,y:d.y,vx:(tx-d.x-30)/0.9,vy:(ty-d.y)/0.9-270,t:0,life:0.9,col:'#ff8c3a',g:600,r:7,fireball:true,tx,ty});}
    if(d.x>W+100)P.dragon=null;}
  // shots
  for(const s of P.shots){s.t+=dt;if(s.t>=s.dur&&!s.done){s.done=true;const tg=s.target;
    if(tg&&tg.kind==='flame'&&P.flames.includes(tg.ref)){P.flames.splice(P.flames.indexOf(tg.ref),1);P.flamesOut++;P.score+=10;pop('+10',s.tx,s.ty-20,'#ffd166',18);SFX.sizzle();spawnParts(s.tx,s.ty-10,10,'rgba(230,240,255,.8)',70,0.7,-120);}
    else if(tg&&tg.kind==='bucket'&&P.rivals.includes(tg.ref)){tg.ref.dunked=4.5;P.dunks++;P.score+=25;pop('DUNKED! +25',s.tx,s.ty-10,'#9be3ff',22);SFX.dunk();spawnParts(tg.ref.x,tg.ref.y-10,30,'#9be3ff',200,0.8);}
    else{spawnParts(s.tx,s.ty,8,'#9be3ff',90,0.4);}}}
  P.shots=P.shots.filter(s=>s.t<s.dur+0.05);
  // timers
  P.shieldT=Math.max(0,P.shieldT-dt);P.shieldCd=Math.max(0,P.shieldCd-dt);P.shake=Math.max(0,P.shake-dt*30);P.wetFlash=Math.max(0,P.wetFlash-dt);
  for(const p of P.parts){p.t+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.fireball&&p.t>=p.life&&!p.spent){p.spent=true;P.flames.push({x:p.tx,y:p.ty,t:0,life:rnd(4,5.5),buoy:false});spawnParts(p.tx,p.ty,8,'#ffb347',120,0.4);}}
  P.parts=P.parts.filter(p=>p.t<p.life);

  if(P.banner){P.banner.t+=dt;if(P.banner.t>2.6)P.banner=null;}
  if(ph.end&&P.rideT>=ph.t+1.9)startFinale();

  async get(key){const r=await fetch(FB_URL.replace(/\/$/,'')+'/staydry/'+key+'.json',{cache:'no-store'});if(!r.ok){const e=new Error('fb '+r.status);e.status=r.status;throw e;}const v=await r.json();return Array.isArray(v)?v:[];},
  async put(key,val){const r=await fetch(FB_URL.replace(/\/$/,'')+'/staydry/'+key+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(val)});if(!r.ok){const e=new Error('fb '+r.status);e.status=r.status;throw e;}}

  const entry=dance?D.postEntry():{score:P.final,stars:P.finalStars,who:G.who,dry:Math.round(P.dry)};
  try{if(LB.mode==='kv'){const key=dance?STORE.keys.dance:STORE.keys.scores;const list=await STORE.get(key);const prev=list.find(r=>r.id===id);

    txt(champ[1].score===order[1][1].score?'A tie! Everyone gets two cookies.':`Judge Michael: "${CAST[champ[0]].name} had the moves. Cookies to the champ."`,W/2,350,11,'#f4e1b5');}
  else{const [k,r]=champ;otxt('DANCE RESULTS',W/2,48,24,'#ffd166','#2a1708',5);drawPerson(210,230,1.0,CAST[k],{arms:'up',mouth:'grin',bounce:6});otxt(String(r.score),W/2,268,36,'#ffd166','#2a1708',6);txt(`${r.acc}% on the beat · ${r.maxCombo} combo · ${r.perfect} perfekt`,W/2,298,12,'#f4e1b5');txt('★'.repeat(r.stars)+'☆'.repeat(3-r.stars),W/2,322,22,'#ffd166');txt(r.stars===3?'Judge Michael: "10 out of 10. Cookies for you."':r.stars===2?'Judge Michael: "Solid. One cookie."':'Judge Michael: "Points for effort. Half a cookie."',W/2,350,11,'#f4e1b5');}
  // judges' cards
  const cards=order[0][1].acc;const vals=[Math.min(10,Math.round(cards/10)),Math.min(10,Math.round(cards/10+0.5)),Math.min(10,Math.max(5,Math.round(cards/10-0.5)))];[150,210,270].forEach((x,i)=>{ctx.fillStyle='#fbf7ee';rr(x-24,370,48,40,4);ctx.fill();txt(String(vals[i]),x,390,20,'#1b2a44');});txt('the judges',W/2,422,10,'#f4e1b5');
  // family dance leaderboard
  ctx.fillStyle='rgba(255,255,255,.07)';rr(30,440,W-60,164,14);ctx.fill();txt('FAMILY DANCE TOP 5',44,454,11,'#f4e1b5','left',700);D.postY=466;
  if(!LB.ready){txt('Family dance board is offline right now.',W/2,504,11,'#f4e1b5');txt('Your best is saved on this device.',W/2,520,11,'#f4e1b5');}
  else{const top=LB.dance.slice(0,5);if(!top.length)txt(LB.loaded?'No dancers yet. Be the first!':'Loading...',W/2,530,12,'#f4e1b5');top.forEach((r,i)=>{const y=512+i*16;txt(`${i+1}.`,46,y,12,'#f4e1b5','left',700);txt(String(r.name).slice(0,12),64,y,12,'#fff','left',700);txt(CAST[r.who]?('as '+CAST[r.who].name):'',200,y,11,'#c9b8a8','left',500);txt('★'.repeat(r.stars||0),W-100,y,11,'#ffd166','right',700);txt(String(r.score),W-46,y,12,'#fff','right',700);});if(LB.msg)txt(LB.msg,W/2,596,11,LB.posted?'#b8f2c2':'#f4a261','center',700);}
  // cookies rain
  for(const c of D.cookies){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);txt('🍪',0,0,22,'#fff');ctx.restore();}
  const by=622;ctx.fillStyle='#ffd166';rr(40,by,160,50,16);ctx.fill();txt('DANCE AGAIN',120,by+25,16,'#07111f','center',700);hits.push({x:40,y:by,w:160,h:50,fn:()=>{SFX.tap();LB.msg='';LB.posted=false;startDance(D.mode);}});
  ctx.fillStyle='rgba(255,255,255,.14)';rr(220,by,160,50,16);ctx.fill();txt('BACK TO TITLE',300,by+25,14,'#fff','center',700);hits.push({x:220,y:by,w:160,h:50,fn:()=>{SFX.tap();G.state='title';}});
  drawSoundBtn();}

// ---------- input
function onPointer(x,y){
  for(const h of hits){if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.fn();return;}}
  if(G.state==='play'){
    // flames
    let best=null,bd=34;for(const f of P.flames){const d=Math.hypot(f.x-x,f.y-y+10);if(d<bd){bd=d;best=f;}}
    if(best){shoot(best.x,best.y,{kind:'flame',ref:best});return;}
    for(const r of P.rivals){if(r.dunked<=0&&Math.hypot(r.x+30-x,r.y-63-y)<30){shoot(r.x+30,r.y-63,{kind:'bucket',ref:r});return;}}
    if(y>555){let si=0,sd=1e9;SEAT_X.forEach((sx,i)=>{const d=Math.abs(sx-x);if(d<sd){sd=d;si=i;}});moveSeat(si);return;}
    shoot(x,y,null);
  }
  else if(G.state==='finale'&&F.t>=4.6){finishGame();}
  else if(G.state==='postcard'){G.state='title';}
  else if(G.state==='dance_play'){const lane=Math.floor(x/(W/4));danceTap(clamp(lane,0,3));}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();onPointer((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H);});
addEventListener('keydown',e=>{if(G.state==='dance_play'){const L={d:0,f:1,j:2,k:3,ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3};if(e.key in L){danceTap(L[e.key]);e.preventDefault();}return;}
  if(G.state==='play'){if(e.key==='ArrowLeft'){moveSeat(P.seat-1);e.preventDefault();}else if(e.key==='ArrowRight'){moveSeat(P.seat+1);e.preventDefault();}else if(e.key===' '||e.key==='ArrowDown'){raiseShield();e.preventDefault();}}
  else if(e.key===' '||e.key==='Enter'){if(G.state==='title'){ac();G.state='select';}else if(G.state==='intro'){introIdx++;if(introIdx>=INTRO.length)startPlay();}else if(G.state==='finale'&&F.t>=4.6)finishGame();else if(G.state==='results')startPlay();}});

// ---------- loop
function frame(ms){const dt=Math.min(0.05,Math.max(0,(ms-last)/1000));last=ms;perf=ms/1000;
  if(LB.mode==='kv'&&perf-LB.lastKv>30&&(G.state==='title'||G.state==='results'||G.state==='dance_results'||G.state==='dance_menu'))kvRefresh();
  if(G.state==='play')updatePlay(dt);else if(G.state==='finale')updateFinale(dt);else if(G.state==='results')resultsT+=dt;else if(G.state.startsWith('dance'))updateDance(dt);
  ctx.setTransform(scl*dpr,0,0,scl*dpr,0,0);hits=[];
  ({sheet:()=>{ctx.fillStyle='#17304d';ctx.fillRect(0,0,W,H);const a=window.__sheetArms||'down';ORDER.forEach((k,i)=>{const x=[70,210,350,120,300][i],y=i<3?330:700;drawPerson(x,y,2.3,CAST[k],{arms:k==='ella'&&a==='down'?'wand':a,mouth:'grin'});txt(CAST[k].name,x,y+18,14,'#fff');});},title:drawTitle,select:drawSelect,intro:drawIntro,play:drawPlay,finale:drawFinale,results:drawResults,postcard:drawPostcard,dance_menu:drawDanceMenu,dance_ready:drawDance,dance_play:drawDance,dance_turn:drawDanceTurn,dance_results:drawDanceResults})[G.state]();placePost();
  requestAnimationFrame(frame);}
window.__debug={G:()=>G,P:()=>P,F:()=>F,LB,sheet:(arms='down')=>{G.state='sheet';window.__sheetArms=arms;},D:()=>D,dance:startDance,danceMenu,tick:frame,start:startPlay,finale:startFinale,results:finishGame,skipTo:t=>{P.rideT=t;},setDry:d=>{P.dry=d;},
  sim:(secs,bot=false,step=1/60)=>{let acc=0;for(let t=0;t<secs;t+=step){perf+=step;acc+=step;if(G.state==='play'){updatePlay(step);if(bot&&acc>=0.5){acc=0;hits=[];if(P.flames.length)onPointer(P.flames[0].x,P.flames[0].y-10);const j=P.jets.find(j=>j.seat===P.seat&&j.t<j.warn);if(j&&Math.random()<0.7)moveSeat((P.seat+1)%3);const r=P.rivals.find(r=>r.dunked<=0&&!r.leaving&&r.x>95&&r.x<W-95);if(r&&Math.random()<0.3)onPointer(r.x+30,r.y-63);}}else if(G.state==='finale')updateFinale(step);else if(G.state==='results')resultsT+=step;else if(G.state.startsWith('dance')){if(D)D.forceClock='perf';updateDance(step);if(bot&&G.state==='dance_play'){for(const n of D.chart){if(!n.hit&&!n.missed&&Math.abs(n.t-D.t)<0.02&&Math.random()<0.9)danceTap(n.lane);}}}}return{state:G.state,D:D&&{score:D.score,perfect:D.perfect,good:D.good,miss:D.miss,idx:D.idx,results:D.results,t:D.t},rideT:P&&P.rideT,dry:P&&P.dry,score:P&&P.score,flamesOut:P&&P.flamesOut,dunks:P&&P.dunks,hits:P&&P.hitCount,blocks:P&&P.blocks,dodges:P&&P.dodges};}};
try{document.fonts&&document.fonts.load('700 20px Fredoka');}catch(e){}
if(location.hash==='#dance'){danceMenu();}
requestAnimationFrame(frame);
</script>
